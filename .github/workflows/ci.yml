name: CargoBit Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_order_e2e:
        description: 'Run the order wallet settlement E2E test'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://test:test@localhost:5432/cargobit_test?schema=public
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_URL: http://localhost:3000
  ENCRYPTION_KEY: ci-encryption-key-minimum-24-chars
  CRON_SECRET: ci-cron-secret-minimum-24-chars
  ADMIN_EMAIL: admin@cargobit.test
  ADMIN_PASSWORD: ci-admin-password
  ADMIN_JWT_SECRET: ci-admin-jwt-secret-minimum-24-chars
  LEGAL_REVIEW_CONFIRMED: 'false'
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  STRIPE_SUBSCRIPTION_WEBHOOK_SECRET: whsec_placeholder
  STRIPE_PAYOUT_WEBHOOK_SECRET: whsec_placeholder
  STRIPE_PRICE_BUSINESS_MONTHLY: price_placeholder
  MAP_PROVIDER: mock
  CI: true

permissions:
  contents: read

jobs:
  beta-ci:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cargobit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare test database
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  readiness-env:
    name: Readiness Env Check (expected red until beta secrets exist)
    runs-on: ubuntu-latest
    needs: beta-ci
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/DATABASE?schema=public
      NEXT_PUBLIC_APP_URL: ''
      ENCRYPTION_KEY: ''
      CRON_SECRET: ''
      ADMIN_EMAIL: admin@cargobit.eu
      ADMIN_PASSWORD: ''
      ADMIN_JWT_SECRET: ''
      LEGAL_REVIEW_CONFIRMED: 'false'
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SUBSCRIPTION_WEBHOOK_SECRET: ''
      STRIPE_PAYOUT_WEBHOOK_SECRET: ''
      STRIPE_PRICE_BUSINESS_MONTHLY: ''
      READINESS_SKIP_DB: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static readiness check
        run: npm run readiness:env

  order-wallet-e2e:
    name: Order Wallet Settlement E2E
    runs-on: ubuntu-latest
    needs: beta-ci
    if: github.event_name == 'workflow_dispatch' && inputs.run_order_e2e == true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cargobit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: npx prisma db push

      - name: Seed E2E users and wallets
        id: seed
        run: |
          node scripts/seed-order-wallet-e2e.mjs | tee seed-output.log
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const output = fs.readFileSync('seed-output.log', 'utf8');
          const match = output.match(/\{[\s\S]*?\n\}/);
          if (!match) throw new Error('Seed JSON output not found');
          const seed = JSON.parse(match[0]);
          console.log(`shipper_token=${seed.shipperToken}`);
          console.log(`carrier_token=${seed.carrierToken}`);
          NODE

      - name: Run order wallet settlement E2E
        env:
          RUN_ORDER_E2E: 'true'
          BASE_URL: http://localhost:3000
          E2E_SHIPPER_TOKEN: ${{ steps.seed.outputs.shipper_token }}
          E2E_CARRIER_TOKEN: ${{ steps.seed.outputs.carrier_token }}
          E2E_SETTLEMENT_READY_JOB_ID: e2e_settlement_ready_transport
          E2E_CARRIER_PAYOUT_METHOD_ID: e2e_carrier_payout_method
        run: npm run test:e2e:order-wallet
